<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wayfair Town</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Alegreya+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<script src="nav.js?v=3" defer></script>
<style>
:root{color-scheme:dark;
/* Garnet & Gilt */
--bg:#190a10;--panel:#2a1019;--panel2:#381522;--ink:#f6ece8;--mute:#c2b3b6;--rule:#4a1d2a;
--red:#b8263f;--gold:#e6c26a;--gold2:#fbe3a0;--silver:#b7bdc6}
*{box-sizing:border-box;min-width:0}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font:16px/1.5 "Alegreya Sans",system-ui,sans-serif;overflow-x:clip}
header{padding:clamp(20px,3vw,40px) max(4vw,14px);background:radial-gradient(ellipse at 15% 0%,#4a0f1f 0,transparent 60%),radial-gradient(ellipse at 90% 10%,#3a2410 0,transparent 55%);border-bottom:2px solid var(--red);margin-bottom:16px}
.wrap{max-width:1000px;margin:0 auto}
h1{font:800 clamp(28px,4.4vw,42px)/1.05 Cinzel,serif;margin:0 0 6px;text-wrap:balance;color:var(--gold);background:linear-gradient(90deg,var(--gold),var(--gold2) 45%,var(--silver));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.sub{color:var(--mute);margin:0}
main{padding:8px max(4vw,14px) 48px}
.card{display:block;background:var(--panel);border:1px solid var(--rule);border-top:3px solid var(--red);border-radius:14px;padding:18px 20px;color:var(--ink);text-decoration:none}
a.card:hover{border-color:var(--gold)}a.card:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.card h2{font:600 19px Cinzel,serif;margin:0 0 4px;color:var(--gold)}.card p{margin:0;color:var(--mute)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.tag{display:inline-block;margin-left:8px;font:500 12px "Alegreya Sans",sans-serif;color:var(--silver);border:1px solid var(--silver);border-radius:99px;padding:0 8px;vertical-align:middle}
.tag.soon{color:var(--mute);border-color:var(--rule)}
</style>
</head>
<body>
<header><div class="wrap">
  <h1>Wayfair Town</h1>
  <p class="sub">Welcome. Pick a place to visit.</p>
</div></header>
<main><div class="wrap">
  <div class="grid">
    <a class="card" href="inventory.html"><h2>Town Inventory <span class="tag">Open</span></h2><p>Live counts of everything the town holds.</p></a>
    <a class="card" href="royaltea-bar.html"><h2>Royaltea Bar <span class="tag">Open</span></h2><p>Sign up to bring drinks, snacks and supplies.</p></a>
    <a class="card" href="crafting.html"><h2>Crafting <span class="tag soon">Soon</span></h2><p>Recipes and what they need.</p></a>
    <a class="card" href="archives.html"><h2>Town Archives <span class="tag soon">Soon</span></h2><p>Records and history of the town.</p></a>
  </div>
</div></main>
</body>
</html>
